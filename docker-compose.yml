version: '3.8'

services:
  # SpecForge Web App
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SPECFORGE_SESSION_SECRET=${SPECFORGE_SESSION_SECRET:-change-me-in-production}
      - SPECFORGE_CSRF_SECRET=${SPECFORGE_CSRF_SECRET:-change-me-in-production}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - SPECFORGE_GITHUB_REDIRECT_URI=${SPECFORGE_GITHUB_REDIRECT_URI:-http://localhost:3000/api/auth/callback}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      - collab-server
    restart: unless-stopped
    networks:
      - specforge-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Collab Server
  collab-server:
    build:
      context: ./collab-server
      dockerfile: Dockerfile
    ports:
      - "1234:1234"
    environment:
      - NODE_ENV=production
      - PORT=1234
    restart: unless-stopped
    networks:
      - specforge-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1234/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis (for rate limiting and caching)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - specforge-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL (optional - for production instead of pglite)
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=specforge
      - POSTGRES_USER=specforge
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-specforge}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - specforge-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specforge"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - postgres

volumes:
  redis-data:
  postgres-data:

networks:
  specforge-network:
    driver: bridge