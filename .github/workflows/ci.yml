name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  web-and-cli:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install

      - name: Security audit (dependencies)
        run: bun audit
        continue-on-error: true

      - name: Validate contracts
        run: bun run contracts:validate

      - name: Lint web
        run: bun run lint

      - name: Run unit tests
        run: bun run test

      - name: Run acceptance tests
        run: bun run test:acceptance

      - name: Build web
        run: bun run build:web

      - name: Run CLI smoke tests
        run: bun run test:cli

  tauri:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install

      - name: Security audit (dependencies)
        run: bun audit
        continue-on-error: true

      - name: Build Tauri desktop app
        run: bun run build:desktop
