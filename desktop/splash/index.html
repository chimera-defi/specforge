<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpecForge — Starting</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1117;
      color: #e4e4e7;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .container {
      text-align: center;
      max-width: 420px;
      padding: 2rem;
    }
    .logo {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      font-size: 0.875rem;
      color: #71717a;
      margin-bottom: 2.5rem;
    }
    .status-list {
      list-style: none;
      text-align: left;
      margin-bottom: 2rem;
    }
    .status-list li {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.625rem 0;
      font-size: 0.9375rem;
      border-bottom: 1px solid #1e1e2e;
    }
    .status-list li:last-child { border-bottom: none; }
    .indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .indicator.waiting { background: #3f3f46; animation: pulse 1.5s ease-in-out infinite; }
    .indicator.ok { background: #22c55e; }
    .indicator.error { background: #ef4444; }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    .progress-bar {
      width: 100%;
      height: 3px;
      background: #1e1e2e;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #a78bfa, #60a5fa);
      width: 0%;
      transition: width 0.5s ease;
    }
    .message {
      font-size: 0.8125rem;
      color: #71717a;
      min-height: 1.25rem;
    }
    .error-panel {
      display: none;
      background: #1c1017;
      border: 1px solid #7f1d1d;
      border-radius: 8px;
      padding: 1.25rem;
      margin-top: 1.5rem;
      text-align: left;
    }
    .error-panel.visible { display: block; }
    .error-panel h3 {
      color: #fca5a5;
      font-size: 0.9375rem;
      margin-bottom: 0.5rem;
    }
    .error-panel p {
      color: #a1a1aa;
      font-size: 0.8125rem;
      line-height: 1.5;
      margin-bottom: 1rem;
    }
    .retry-btn {
      background: #7c3aed;
      color: #fff;
      border: none;
      padding: 0.5rem 1.25rem;
      border-radius: 6px;
      font-size: 0.875rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .retry-btn:hover { background: #6d28d9; }
    .retry-btn:active { background: #5b21b6; }
    .settings-btn {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: #27272a;
      color: #a1a1aa;
      border: 1px solid #3f3f46;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .settings-btn:hover { background: #3f3f46; color: #e4e4e7; }
    .config-panel {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.8);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .config-panel.visible { display: flex; }
    .config-content {
      background: #18181b;
      border: 1px solid #3f3f46;
      border-radius: 12px;
      padding: 2rem;
      max-width: 480px;
      width: 90%;
    }
    .config-content h3 {
      color: #e4e4e7;
      font-size: 1.125rem;
      margin-bottom: 1.5rem;
    }
    .config-field {
      margin-bottom: 1.25rem;
    }
    .config-field label {
      display: block;
      color: #a1a1aa;
      font-size: 0.875rem;
      margin-bottom: 0.5rem;
    }
    .config-field input {
      width: 100%;
      background: #27272a;
      border: 1px solid #3f3f46;
      color: #e4e4e7;
      padding: 0.625rem;
      border-radius: 6px;
      font-size: 0.9375rem;
    }
    .config-field input:focus {
      outline: none;
      border-color: #7c3aed;
    }
    .config-actions {
      display: flex;
      gap: 0.75rem;
      justify-content: flex-end;
      margin-top: 1.5rem;
    }
    .config-btn {
      padding: 0.5rem 1.25rem;
      border-radius: 6px;
      font-size: 0.875rem;
      cursor: pointer;
      transition: background 0.15s;
      border: none;
    }
    .config-btn.primary {
      background: #7c3aed;
      color: #fff;
    }
    .config-btn.primary:hover { background: #6d28d9; }
    .config-btn.secondary {
      background: #27272a;
      color: #a1a1aa;
      border: 1px solid #3f3f46;
    }
    .config-btn.secondary:hover { background: #3f3f46; color: #e4e4e7; }
  </style>
</head>
<body>
  <button class="settings-btn" id="settings-btn">⚙️ Settings</button>

  <div class="container">
    <div class="logo">SpecForge</div>
    <p class="subtitle">Starting desktop services&hellip;</p>

    <ul class="status-list">
      <li>
        <span class="indicator waiting" id="ind-web"></span>
        <span>Web application</span>
      </li>
      <li>
        <span class="indicator waiting" id="ind-collab"></span>
        <span>Collaboration server</span>
      </li>
    </ul>

    <div class="progress-bar">
      <div class="progress-fill" id="progress"></div>
    </div>

    <p class="message" id="message">Waiting for services&hellip;</p>

    <div class="error-panel" id="error-panel">
      <h3>Services failed to start</h3>
      <p id="error-detail">One or more services did not respond within 30 seconds.</p>
      <button class="retry-btn" id="retry-btn">Retry</button>
    </div>
  </div>

  <div class="config-panel" id="config-panel">
    <div class="config-content">
      <h3>Desktop Settings</h3>
      <div class="config-field">
        <label for="web-port">Web Port</label>
        <input type="number" id="web-port" value="3000" min="1024" max="65535">
      </div>
      <div class="config-field">
        <label for="collab-port">Collab Port</label>
        <input type="number" id="collab-port" value="4322" min="1024" max="65535">
      </div>
      <div class="config-field">
        <label for="timeout">Startup Timeout (seconds)</label>
        <input type="number" id="timeout" value="30" min="10" max="120">
      </div>
      <div class="config-actions">
        <button class="config-btn secondary" id="config-cancel">Cancel</button>
        <button class="config-btn primary" id="config-save">Save & Restart</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var WEB_URL = 'http://localhost:3000/api/health';
      var COLLAB_URL = 'http://127.0.0.1:4322/health';
      var APP_URL = 'http://localhost:3000';
      var TIMEOUT_S = 30;
      var POLL_MS = 1500;

      var indWeb = document.getElementById('ind-web');
      var indCollab = document.getElementById('ind-collab');
      var progress = document.getElementById('progress');
      var message = document.getElementById('message');
      var errorPanel = document.getElementById('error-panel');
      var errorDetail = document.getElementById('error-detail');
      var retryBtn = document.getElementById('retry-btn');
      var settingsBtn = document.getElementById('settings-btn');
      var configPanel = document.getElementById('config-panel');
      var configCancel = document.getElementById('config-cancel');
      var configSave = document.getElementById('config-save');
      var webPortInput = document.getElementById('web-port');
      var collabPortInput = document.getElementById('collab-port');
      var timeoutInput = document.getElementById('timeout');

      var startTime = 0;
      var timer = null;
      var webReady = false;
      var collabReady = false;

      function setIndicator(el, state) {
        el.className = 'indicator ' + state;
      }

      function checkHealth(url) {
        return fetch(url, { mode: 'no-cors', cache: 'no-store' })
          .then(function (r) {
            // no-cors returns opaque response (status 0), but if fetch succeeds the server is up
            return true;
          })
          .catch(function () {
            return false;
          });
      }

      function updateProgress() {
        var elapsed = (Date.now() - startTime) / 1000;
        var pct = Math.min((elapsed / TIMEOUT_S) * 100, 100);
        progress.style.width = pct + '%';
      }

      function showError(detail) {
        message.textContent = '';
        errorDetail.textContent = detail;
        errorPanel.className = 'error-panel visible';
      }

      function hideError() {
        errorPanel.className = 'error-panel';
      }

      function poll() {
        var elapsed = (Date.now() - startTime) / 1000;
        updateProgress();

        if (elapsed >= TIMEOUT_S) {
          clearInterval(timer);
          timer = null;
          var failed = [];
          if (!webReady) failed.push('Web application');
          if (!collabReady) failed.push('Collaboration server');
          showError(
            failed.join(' and ') +
            ' did not respond within ' + TIMEOUT_S + ' seconds. ' +
            'Check that the services are configured correctly.'
          );
          return;
        }

        var checks = [];
        if (!webReady) {
          checks.push(
            checkHealth(WEB_URL).then(function (ok) {
              if (ok) {
                webReady = true;
                setIndicator(indWeb, 'ok');
              }
            })
          );
        }
        if (!collabReady) {
          checks.push(
            checkHealth(COLLAB_URL).then(function (ok) {
              if (ok) {
                collabReady = true;
                setIndicator(indCollab, 'ok');
              }
            })
          );
        }

        Promise.all(checks).then(function () {
          if (webReady && collabReady) {
            clearInterval(timer);
            timer = null;
            message.textContent = 'Ready — opening SpecForge\u2026';
            progress.style.width = '100%';
            setTimeout(function () {
              window.location.href = APP_URL;
            }, 400);
          } else {
            var parts = [];
            if (webReady) parts.push('Web ready');
            if (collabReady) parts.push('Collab ready');
            var waiting = [];
            if (!webReady) waiting.push('web');
            if (!collabReady) waiting.push('collab');
            message.textContent =
              (parts.length ? parts.join(', ') + ' \u2014 ' : '') +
              'waiting for ' + waiting.join(', ') + '\u2026';
          }
        });
      }

      function start() {
        webReady = false;
        collabReady = false;
        setIndicator(indWeb, 'waiting');
        setIndicator(indCollab, 'waiting');
        hideError();
        message.textContent = 'Waiting for services\u2026';
        progress.style.width = '0%';
        startTime = Date.now();
        if (timer) clearInterval(timer);
        timer = setInterval(poll, POLL_MS);
        poll();
      }

      retryBtn.addEventListener('click', start);
      
      // Config panel handlers
      settingsBtn.addEventListener('click', function () {
        configPanel.className = 'config-panel visible';
        webPortInput.value = parseInt(WEB_URL.split(':')[2]);
        collabPortInput.value = parseInt(COLLAB_URL.split(':')[2]);
        timeoutInput.value = TIMEOUT_S;
      });

      configCancel.addEventListener('click', function () {
        configPanel.className = 'config-panel';
      });

      configSave.addEventListener('click', function () {
        var newWebPort = parseInt(webPortInput.value);
        var newCollabPort = parseInt(collabPortInput.value);
        var newTimeout = parseInt(timeoutInput.value);

        if (newWebPort && newCollabPort && newTimeout) {
          WEB_URL = 'http://localhost:' + newWebPort + '/api/health';
          COLLAB_URL = 'http://127.0.0.1:' + newCollabPort + '/health';
          APP_URL = 'http://localhost:' + newWebPort;
          TIMEOUT_S = newTimeout;

          localStorage.setItem('specforge_web_port', newWebPort);
          localStorage.setItem('specforge_collab_port', newCollabPort);
          localStorage.setItem('specforge_timeout', newTimeout);

          configPanel.className = 'config-panel';
          start();
        }
      });

      // Load saved settings
      var savedWebPort = localStorage.getItem('specforge_web_port');
      var savedCollabPort = localStorage.getItem('specforge_collab_port');
      var savedTimeout = localStorage.getItem('specforge_timeout');

      if (savedWebPort) WEB_URL = 'http://localhost:' + savedWebPort + '/api/health';
      if (savedCollabPort) COLLAB_URL = 'http://127.0.0.1:' + savedCollabPort + '/health';
      if (savedTimeout) TIMEOUT_S = parseInt(savedTimeout);
      if (savedWebPort) APP_URL = 'http://localhost:' + savedWebPort;

      start();
    })();
  </script>
</body>
</html>
